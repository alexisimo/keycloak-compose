services:
  postgres-db:
    image: postgres:16.0
    container_name: postgres
    restart: always
    volumes:
      - ${POSTGRES_DATA_DIR}:/var/lib/postgresql/data
    networks:
      - keycloak-network
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}

  keycloak:
    image: quay.io/keycloak/keycloak:26.5
    container_name: keycloak
    restart: always
    depends_on:
      - postgres-db
    command:
      - start
    networks:
      - keycloak-network
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABSE: ${DB_NAME}
      KC_DB_USERNAME: ${DB_USER}
      KC_DB_PASSWORD: ${DB_PASSWORD}
      KC_HTTP_ENABLED: true
      KC_PROXY_HEADERS: xforwarded
      KC_PROXY_ADDRESS_FORWARDING: true
      KC_HOSTNAME_STRICT: false
      KC_HOSTNAME: ${KC_HOSTNAME_URL}
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}

  backup_nfs:
    image: ${IMAGE_BACKUP_NAME}
    container_name: app_backup_nfs
    restart: unless-stopped
    build: ./backupper/
    user: 200:200
    environment:
      - TZ="Europe/Madrid"
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - CRON_LINE=${CRON_LINE_COMPAT}
    volumes:
      - ${POSTGRES_DATA_DIR_BACKUP}:/pgsqlbackup
      - ${APP_DATA_DIR}:/app-data:ro
    depends_on:
      - postgres-db  

  nginx:
    image: nginx:latest
    container_name: nginx
    environment:
      KEYCLOAK_HOSTNAME: ${KC_HOSTNAME_URL}
    ports:
      - "${HTTP_PORT}:80"
      - "${HTTPS_PORT}:443"
    volumes:
      - ./default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - /etc/letsencrypt:/etc/letsencrypt
    depends_on:
      - keycloak
    networks:
      - keycloak-network

networks:
  keycloak-network:
